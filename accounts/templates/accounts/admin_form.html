{% extends "base.html" %}

{% block title %}New admin{% endblock %}

{% block content %}
<p><a class="back-link" href="{% url 'accounts:users' %}">← Back to users</a></p>

<div class="narrow">
  <div class="page-header">
    <div>
      <h1>Create an admin account</h1>
      <p class="muted">Admins can read, reply to and delete feedback from every customer, and can create other admins.</p>
    </div>
  </div>

  <form method="post" class="card form">
    {% csrf_token %}
    <div class="form-fields">{{ form.as_div }}</div>
    <div class="form-actions">
      <a class="btn btn-secondary" href="{% url 'accounts:users' %}">Cancel</a>
      <button type="submit" class="btn btn-primary">Create admin</button>
    </div>
  </form>
</div>
{% endblock %}
